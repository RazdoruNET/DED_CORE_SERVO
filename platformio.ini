; DED CORE SERVO — модуль привода сервопривода (заслонка/клапан) для DED CORE V4.
;
; Модуль подключается к точке доступа ядра как обычный клиент, получает целевое
; положение сервы в кадре телеметрии WebSocket (порт 81) и отрабатывает его
; H-мостом по датчику положения. Протокол — docs/PROTOCOL.md.
;
; Сборка: pio run
; Прошивка: pio run -t upload

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Версия платформы закреплена так же, как в DED_CORE_V4: WebSockets 2.4 не
; собирается на Arduino core 3.x, где убраны нужные ей API.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    ; ElegantOTA в режиме ESPAsyncWebServer: страница обновления живёт на том же
    ; сервере, что и портал настройки.
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
    ; ArduinoJson 5.x обязателен: контракт ядра разбирается через StaticJsonBuffer.
    bblanchon/ArduinoJson@^5.13.4
    links2004/WebSockets@2.4.1
    ; ElegantOTA 3.x требует ESPAsyncWebServer ^3.3.11. Сервер и AsyncTCP закреплены
    ; на версиях из этой ветки: старая связка me-no-dev 1.2.3 + 1.1.1 в сборку всё
    ; равно не попадала — PlatformIO поднимал зависимости ElegantOTA.
    mathieucarbou/ESPAsyncWebServer@3.6.0
    mathieucarbou/AsyncTCP@3.3.2
    ayushsharma82/ElegantOTA@3.1.6
